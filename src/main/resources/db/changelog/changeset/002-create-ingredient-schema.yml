databaseChangeLog:
  - changeSet:
      id: 1
      author: evgen
      changes:
        - createTable:
            tableName: ingredient
            columns:
              - column:
                  name: id
                  type: varchar(4)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(25)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(10)
                  constraints:
                    nullable: false
