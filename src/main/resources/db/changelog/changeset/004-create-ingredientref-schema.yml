databaseChangeLog:
  - changeSet:
      id: 1
      author: evgen
      changes:
        - createTable:
            tableName: ingredient_ref
            columns:
              - column:
                  name: ingredient
                  type: varchar(4)
                  constraints:
                    nullable: false
              - column:
                  name: taco
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: taco_key
                  type: bigint
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: evgen
      changes:
        - addForeignKeyConstraint:
            baseTableName: ingredient_ref
            baseColumnNames: ingredient
            referencedTableName: ingredient
            referencedColumnNames: id
            constraintName: fk_ingredientref_ingredient
